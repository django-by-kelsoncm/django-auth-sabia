site_name: django-sabia-auth
site_description: Django OAuth2 authentication backend for Sabiá (Brazil's SUS identity provider)
site_author: kelsoncm
repo_url: https://github.com/django-by-kelsoncm/django-auth-sabia
repo_name: django-by-kelsoncm/django-auth-sabia
site_url: https://django-by-kelsoncm.github.io/django-auth-sabia/

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Pipeline de Perfil de Usuário: user-info-pipeline.md
  - Fetchers (Busca de Dados): fetchers.md
  - Mappers (Mapeamento): mappers.md
  - Scopes: scopes.md
  - Usage: usage.md
  - API Reference: api-reference.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
